name: Build and Release TACHYS Editor

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scikit-learn
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Run Build Script
        run: python build.py

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czf "../TACHYS-Editor-${{ runner.os }}.tar.gz" "TACHYS Editor"
        shell: bash

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path "dist/TACHYS Editor" -DestinationPath "TACHYS-Editor-Windows.zip"
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: TACHYS-Editor-${{ runner.os }}
          path: |
            TACHYS-Editor-*.tar.gz
            TACHYS-Editor-*.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-assets
          pattern: TACHYS-Editor-*
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false